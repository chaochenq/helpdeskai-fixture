# SECURITY FIXTURE — DELIBERATELY VULNERABLE WORKFLOW
# This file is a test fixture for Trent's agentic deployment automation posture
# analysis. It contains deliberately planted vulnerabilities. Do NOT use this
# as a template for real workflows.
#
# PLANTED FINDINGS:
#   VULN-CI-001: REMEDIATED (MT-PA-013) — switched to `pull_request` + safe
#                default merge-commit checkout (was pull_request_target + PR head).
#   VULN-CI-007: contents: write permission allows agent to modify workflow files
#   VULN-CI-005 (partial): anthropics/claude-code-action@v1 is a floating tag

name: Claude Code PR Review

on:
  # MT-PA-013 (remediated VULN-CI-001): use `pull_request`, not
  # `pull_request_target`. `pull_request` runs in the fork's context WITHOUT
  # base-repo secrets or a writable GITHUB_TOKEN, so attacker-controlled fork
  # code can no longer execute with the base repo's privileges.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest

    # VULN-CI-007: contents: write means Claude Code can write to .github/workflows/
    # and modify its own workflow — a workflow self-modification vector.
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # MT-PA-013 (remediated VULN-CI-001): no explicit `ref:` — the default
          # `pull_request` checkout is the safe merge commit, not the raw fork
          # head. Combined with the `pull_request` trigger above, the agent no
          # longer reads/executes attacker-controlled fork content with base
          # privileges.
          fetch-depth: 0

      - name: Run Claude Code review
        # VULN-CI-005: Floating tag @v1 — not pinned to a commit SHA.
        # A supply-chain compromise of anthropics/claude-code-action could replace
        # this tag with malicious code that exfiltrates GITHUB_TOKEN and secrets.
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The @claude trigger phrase means any PR commenter can invoke the agent.
          trigger_phrase: "@claude"
          # Claude Code will read .claude/skills/ from the checked-out head — which
          # is the attacker's version of those files when the PR is from a fork.
          claude_args: "--max-turns 20"
