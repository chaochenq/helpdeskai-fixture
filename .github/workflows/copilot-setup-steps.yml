# SECURITY FIXTURE — POSITIVE CONTROL WORKFLOW
# This file configures the environment for GitHub Copilot's coding agent.
# GitHub Copilot's coding agent is platform-managed — it is triggered by assigning
# an issue to Copilot (via the GitHub UI or @copilot mention), not by a workflow
# trigger or a 'uses:' action reference. This file is the only user-controlled
# surface: it pre-configures the ephemeral runner environment before Copilot starts.
#
# POSITIVE CONTROLS:
#   CTRL-CI-004: read-only permissions, no secrets injected, minimal tool surface
#   CTRL-CI-004 (platform): Copilot further restricts itself to copilot/* branches
#                            and requires human approval before running workflows
#                            on PRs it opens.

name: Copilot Setup Steps

on:
  # These triggers exist so the setup steps can be tested and validated.
  # They do not control when Copilot's coding agent runs — that is platform-managed.
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job name 'copilot-setup-steps' is required by GitHub — Copilot looks for
  # this exact job name to configure the agent's ephemeral environment.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # CTRL-CI-004: Read-only permissions. Copilot's agent does not need write
    # access during environment setup — it will be granted appropriate write
    # access to its own branch by the platform. No id-token: write means
    # setup cannot request cloud credentials (appropriate for env setup).
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify test suite runs
        run: |
          pytest tests/ --tb=short -q
